apiVersion: v1
kind: Service
metadata:
  name: invoice-service
  labels:
    app: invoice-service
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: invoice-service
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-service-headless
  labels:
    app: invoice-service
spec:
  clusterIP: None
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: invoice-service